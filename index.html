<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sopa de letras</title>
    <script src="./webroot/js/main.js" defer></script>
    <link rel="stylesheet" href="./webroot/css/styles.css">
    <script>
        document.addEventListener("DOMContentLoaded",() =>{
            let textoHora = document.getElementById("hora");
            textoHora.innerHTML = obtenerHoraActual();
            setInterval(() => {
                textoHora.innerHTML = obtenerHoraActual();
            }, 1000);
        })
    </script>
    <script>
        setInterval(() => {
            if (!aTerminado)
            document.getElementById("temporizador").innerHTML = segATiempo(temporizador());
        }, 333);
    </script>
</head>
<body>
    <header>
        <h1>Sopa de letras</h1>
        <span id="checkInternet"></span>
    </header>
    <main>
        <div id="contenedorSopa">
            <button id="btnEmpezar">Empezar</button>
            <div id="sopaLetras" class="antesAnimacion">
                <div id="temporizador"></div>
            </div>
            <div id="palabras" class="antesAnimacion"></div>
        </div>
        <div id="puntuaciones">
            <table>
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Nombre</th>
                        <th>Puntuacion</th>
                        <th>Tiempo</th>
                        <th>Nº Pal</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
    <footer>
        <p>
            <span><a href="https://github.com/yatusabebeibe/JTGDWECSopaLetras/" target="_blank">
                <img src="./webroot/images/github.svg">
            </a></span>
            <a href="../../" target="_self">Jesús Temprano Gallego</a> | 17/12/2025
        </p>
        <p id="hora"></p>
    </footer>
    <div id="fondoPrompt" class="antesAnimacion">
        <form id="cuerpoPrompt">
            <h3 id="msgPrompt"></h3>
            <input type="text" id="datoPrompt">
            <button type="submit" id="btnEnviar">Enviar</button>
        </form>
    </div>
</body>
</html>
